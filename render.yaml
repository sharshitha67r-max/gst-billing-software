# Free Render compute with a separately provisioned free Turso/libSQL database.
# Keep both services within their free quotas; no local business-data storage.
services:
  - type: web
    name: svs-enterprises-billing
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_BACKEND
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: PORT
        value: 8000
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
